<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhatti Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101828,#182848);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:15px;
}

.login{
  background:#fff;
  color:#111;
  padding:30px 20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 30px #0008;
}

.login h1{
  color:#e63946;
  margin-bottom:10px;
}

.login p{
  color:#666;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login button{
  width:100%;
  background:#e63946;
  color:white;
  margin-top:10px;
}

.game{
  display:none;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.header h1{
  font-size:26px;
}

.coins{
  background:#f5c542;
  color:#111;
  padding:8px 12px;
  border-radius:20px;
  font-weight:bold;
}

.board{
  width:100%;
  aspect-ratio:1;
  background:white;
  padding:5px;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border:5px solid #111;
  border-radius:12px;
  overflow:hidden;
}

.cell{
  border:1px solid #bbb;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
}

.red{background:#e63946;}
.green{background:#2a9d5b;}
.yellow{background:#f4c430;}
.blue{background:#2878d4;}

.home-red{background:#ff7777;}
.home-green{background:#72d69b;}
.home-yellow{background:#ffe477;}
.home-blue{background:#72aaf0;}

.center{
  background:linear-gradient(45deg,#e63946 25%,#f4c430 25%,#f4c430 50%,#2a9d5b 50%,#2a9d5b 75%,#2878d4 75%);
}

.controls{
  margin-top:15px;
  background:#ffffff15;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

.dice{
  width:75px;
  height:75px;
  background:white;
  color:#111;
  margin:10px auto;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  font-weight:bold;
}

.roll{
  background:#f5c542;
  color:#111;
  width:150px;
}

.message{
  margin-top:10px;
  min-height:25px;
  font-weight:bold;
}

.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.player{
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}

.p1{background:#e63946;}
.p2{background:#2a9d5b;}
.p3{background:#f4c430;color:#111;}
.p4{background:#2878d4;}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div class="login" id="login">
  <h1>🎲 Bhatti Ludo</h1>
  <p>Welcome to Bhatti Games</p>

  <input id="name" type="text" placeholder="Apna naam likhein">
  <input id="email" type="email" placeholder="Email">

  <button onclick="startGame()">LOGIN / PLAY</button>
</div>


<!-- GAME -->
<div class="game" id="game">

  <div class="header">
    <h1>🎲 Bhatti Ludo</h1>
    <div class="coins">🪙 <span id="coins">100</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">

    <div>آپ کی باری</div>

    <div class="dice" id="dice">🎲</div>

    <button class="roll" onclick="rollDice()">ROLL DICE</button>

    <div class="message" id="message">
      Dice roll کریں!
    </div>

  </div>

  <div class="players">
    <div class="player p1">🔴 Player 1</div>
    <div class="player p2">🟢 Player 2</div>
    <div class="player p3">🟡 Player 3</div>
    <div class="player p4">🔵 Player 4</div>
  </div>

</div>

</div>


<script>

let coins = 100;
let playerName = "";

function startGame(){

  playerName = document.getElementById("name").value.trim();

  if(playerName === ""){
    alert("Apna naam likhein");
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="block";

  document.getElementById("message").innerText =
    "Welcome " + playerName + "! Dice roll karein.";

  createBoard();
}


function createBoard(){

  const board = document.getElementById("board");

  board.innerHTML="";

  for(let r=0;r<15;r++){

    for(let c=0;c<15;c++){

      let cell=document.createElement("div");

      cell.className="cell";

      /*
       * Four home areas
       */

      if(r<6 && c<6){
        cell.classList.add("home-red");
      }

      else if(r<6 && c>8){
        cell.classList.add("home-green");
      }

      else if(r>8 && c<6){
        cell.classList.add("home-yellow");
      }

      else if(r>8 && c>8){
        cell.classList.add("home-blue");
      }

      /*
       * Main paths
       */

      else if(r===6 || r===7 || r===8 ||
              c===6 || c===7 || c===8){

        cell.style.background="#f8f8f8";
      }

      /*
       * Center
       */

      if(r>=6 && r<=8 && c>=6 && c<=8){

        cell.classList.add("center");

      }

      board.appendChild(cell);
    }
  }
}


function rollDice(){

  let number=Math.floor(Math.random()*6)+1;

  document.getElementById("dice").innerText=number;

  document.getElementById("message").innerText=
    "آپ نے " + number + " نکالا!";

  /*
   * Small coin reward
   */

  if(number===6){

    coins += 10;

    document.getElementById("message").innerText=
      "🎉 6 آیا! +10 coins";

  }

  else{

    coins += 1;

  }

  document.getElementById("coins").innerText=coins;
}


createBoard();

</script>

</body>
</html>
